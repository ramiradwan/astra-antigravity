<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delegated task</title><style>:root {
  color-scheme: light dark;
  --card-bg: var(--color-background-primary, #fff);
  --text: var(--color-text-primary, #1a1a1a);
  --muted: var(--color-text-secondary, #626262);
  --line: var(--color-border-primary, #dedede);
  --soft: var(--color-background-secondary, #f5f5f5);
  --focus: #2563eb;
  font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  color: var(--text); background: transparent;
}
:root[data-theme="dark"] { --card-bg: var(--color-background-primary, #212121); --text: var(--color-text-primary, #f5f5f5); --muted: var(--color-text-secondary, #b7b7b7); --line: var(--color-border-primary, #484848); --soft: var(--color-background-secondary, #2c2c2c); --focus: #8ab4ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card-bg: var(--color-background-primary, #212121); --text: var(--color-text-primary, #f5f5f5); --muted: var(--color-text-secondary, #b7b7b7); --line: var(--color-border-primary, #484848); --soft: var(--color-background-secondary, #2c2c2c); --focus: #8ab4ff; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: transparent; }
button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.card { width: 100%; background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px; padding: 20px; overflow-wrap: anywhere; }
.heading { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.dot { flex: 0 0 8px; width: 8px; height: 8px; background: var(--muted); border-radius: 100%; }
.success .dot { background: #15803d; }
.attention .dot { background: #b36b00; }
h1 { font-size: 16px; line-height: 1.4; margin: 0; font-weight: 600; }
h2 { font-size: 13px; line-height: 1.4; margin: 0 0 8px; font-weight: 600; }
p { font-size: 14px; line-height: 1.55; margin: 0 0 12px; white-space: pre-wrap; }
.task { font-weight: 500; }
.muted, .meta, .notice, .stamp { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 14px; font-size: 12px; line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.action { color: var(--text); background: var(--card-bg); border: 1px solid var(--line); padding: 9px 14px; border-radius: 999px; min-height: 40px; font-size: 13px; font-weight: 500; }
.action.primary { color: var(--card-bg); background: var(--text); border-color: var(--text); }
.action:hover:not(:disabled) { filter: brightness(.94); }
.stamp { margin: 14px 0 0; font-size: 11px; line-height: 1.5; }
.notice, .error { margin: 12px 0 0; font-size: 12px; line-height: 1.5; }
.error { color: var(--text); padding: 10px 12px; border-radius: 10px; background: var(--soft); }
.section { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.disclosure summary { cursor: pointer; font-size: 13px; line-height: 1.5; font-weight: 500; }
.disclosure > p { margin-top: 10px; }
.card > .disclosure { margin-bottom: 14px; }
.checks ul { margin-top: 10px; }
.files { padding: 0; list-style: none; }
.file { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 0; }
.file-label { min-width: 0; }
.file small { display: block; color: var(--muted); font-size: 11px; }
.text-action { flex: 0 0 auto; color: var(--text); text-decoration: underline; text-underline-offset: 3px; background: transparent; border: 0; border-radius: 3px; padding: 4px; font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 380px) { .card { padding: 16px; border-radius: 12px; } .actions { align-items: stretch; } .action { flex: 1 1 auto; } .file { flex-wrap: wrap; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
