.panel-nav button[aria-current="page"] { border-bottom-color: var(--card-action); font-weight: 600; background: var(--card-soft); }
.panel-list { display: grid; gap: .875rem; list-style: none; padding: 0 !important; }
.panel-item { border: 1px solid var(--card-line); border-radius: var(--card-radius); padding: 1rem; min-width: 0; }
.panel-item h2, .panel-item h3 { margin: 0; font-size: var(--card-body-size); line-height: var(--card-body-line); font-weight: 600; }
.panel-item .status-line { margin-top: .375rem; }
.panel-item .meta { margin-top: .625rem; }
.panel-item > p, .panel-item > details, .panel-item > form { margin-top: .625rem; }
.panel-item .actions { margin-top: .75rem; }
.panel-item .actions .action { min-inline-size: 0; }
.panel-item .panel-muted, .panel-hint { font-size: var(--card-small-size); line-height: var(--card-small-line); }
.panel-empty { padding-block: 1rem; }
.panel-field { display: grid; gap: .375rem; margin-block: .875rem; max-width: 34rem; }
.panel-field label { font-size: var(--card-small-size); font-weight: 500; }
.control-panel input:not([type="checkbox"]), .control-panel select { width: 100%; min-width: 0; min-height: 44px; padding: .625rem .75rem; font: inherit; color: var(--card-text); background: var(--card-bg); border: 1px solid var(--card-line); border-radius: var(--card-radius); }
.control-panel input:focus-visible, .control-panel select:focus-visible { outline: 2px solid var(--card-focus); outline-offset: 2px; }
.panel-checkbox { display: flex; align-items: flex-start; gap: .625rem; margin-top: .875rem; cursor: pointer; }
.panel-checkbox input { flex: none; width: 1.125rem; height: 1.125rem; margin: .2rem 0 0; accent-color: var(--card-action); }
.panel-confirm { border: 1px solid var(--card-warning); background: var(--card-soft); border-radius: var(--card-radius); padding: 1rem; margin-block: 1rem; }
.panel-confirm h2 { margin-bottom: .5rem; }
.panel-confirm .actions { margin-top: .75rem; }
.action.danger { color: var(--card-danger); border-color: var(--card-danger); }
.panel-code { display: block; padding: .875rem; margin-block: .75rem; border-radius: var(--card-radius); background: var(--card-soft); font-family: var(--astra-mono, monospace); white-space: pre-wrap; overflow-wrap: anywhere; }
.panel-receipts { margin-top: 1rem; }
.panel-receipt + .panel-receipt { margin-top: .75rem; }
.panel-receipt p + p { margin-top: .25rem; }
.panel-workspaces { padding-inline-start: 1.25rem; margin-top: .625rem !important; }
.panel-section + .panel-section, .panel-section > .panel-section { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--card-line); }
@media (max-width: 380px) {
  .panel-item, .panel-confirm { padding: .875rem; }
  .panel-nav .action { flex: 1 1 0; padding-inline: .5rem; }
  .panel-heading .text-action { padding-inline-start: 0; }
}
@media (forced-colors: active) {
  .panel-nav button[aria-current="page"] { border-bottom-color: Highlight; }
  .panel-confirm { border-color: CanvasText; }
  .action.danger { color: ButtonText; border-color: ButtonText; }
}
